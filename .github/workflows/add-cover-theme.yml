name: Add cover-inspired card theme

on:
  push:
    branches: [main]
    paths:
      - cover-theme.js

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add cover theme script to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="cover-theme.js"></script>'
          if marker not in text:
              needle = '<script src="ao3-screenshot-fix.js"></script>'
              if needle not in text:
                  raise SystemExit('Could not find the script insertion point in index.html')
              text = text.replace(needle, marker + needle, 1)
              p.write_text(text, encoding='utf-8')
              print('Inserted cover-theme.js')
          else:
              print('cover-theme.js already present')

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add cover-inspired book card theme'
            git push
          fi
