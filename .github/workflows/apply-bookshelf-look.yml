name: Apply Bookshelf Look

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply cozy bookshelf styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* BOOKSHELF-IMAGE-STYLE */'
          if marker in s:
              print('Styling already present; nothing to do.')
              raise SystemExit(0)
          css = r'''/* BOOKSHELF-IMAGE-STYLE */
          #bookshelfPanel{display:flex;flex-direction:column;gap:0}
          #bookshelfPanel>.stats{order:1}
          #bookshelfPanel>.toolbar{order:2}
          #currentlySection{order:3}
          #archivedSection{order:4}
          #dnfSection{order:5}
          #currentlySection .panel,#archivedSection .panel{background:rgba(255,255,255,.72);border-color:#eadde4}
          #dnfSection{background:linear-gradient(135deg,rgba(255,244,247,.96),rgba(255,232,237,.82));border:1px solid #f2b9c7;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(190,85,110,.10)}
          #dnfSection .section-title{color:#a53f58}
          #dnfSection .section-sub{color:#a56b79}
          #dnfSection .book{background:rgba(255,250,251,.96);border-color:#f0c6d0;box-shadow:0 7px 20px rgba(190,85,110,.08)}
          #dnfSection .chip{background:#ffe1e8;color:#9f3f58}
          .shelf{grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
          .book{display:grid;grid-template-columns:96px 1fr;min-height:150px;border-radius:18px;background:rgba(255,253,253,.96);box-shadow:0 7px 22px rgba(190,115,145,.08)}
          .cover{height:150px;min-height:150px;border-radius:0;background:linear-gradient(145deg,#ffeaf2,#f9e9f2)}
          .cover-placeholder{font-size:32px}
          .book-body{padding:13px 13px 12px;min-width:0}
          .book-title{font-size:17px;line-height:1.15}
          .author{font-size:12px}
          .chips{margin:7px 0}
          .meta{font-size:10.5px}
          .book-actions{flex-wrap:wrap}
          .book-actions .btn{padding:6px 8px}
          #currentlySection .section-title{color:#6950a0}
          #currentlySection .section-sub{color:#8b789d}
          #currentlySection .chip{background:#eee6ff;color:#7655a0}
          #archivedSection .section-title{color:#4f8065}
          #archivedSection .section-sub{color:#789080}
          #archivedSection .chip{background:#e5f5ec;color:#4f8065}
          @media(max-width:600px){.book{grid-template-columns:88px 1fr}.cover{height:140px;min-height:140px}}
          '''
          css = '\n'.join(line.strip() for line in css.splitlines())
          if '</style>' not in s:
              raise SystemExit('Could not find style block in index.html')
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit styling change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Apply cozy bookshelf card design'
            git push
          fi
