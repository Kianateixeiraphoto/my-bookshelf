name: Apply floral visual theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-theme:
    if: github.event.head_commit.message != 'Apply floral theme styles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add floral visual theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* FLORAL-PINK-THEME-V1 */'
          if marker not in s:
              css = r'''
          /* FLORAL-PINK-THEME-V1 */
          :root{--bg:#fff8fa;--card:#fffdfc;--ink:#3f3037;--muted:#896f7a;--line:#efd3dc;--accent:#d96f91;--accent2:#fde1e9;--shadow:0 10px 28px rgba(180,93,122,.12)}
          body{background:radial-gradient(circle at 50% 0%,#fffdfb 0,#fff8fa 55%,#fcebf1 100%);color:var(--ink)}
          body:before{opacity:.12;background-image:radial-gradient(#d96f91 1px,transparent 1px);background-size:28px 28px}
          body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.8;background:radial-gradient(ellipse at 1% 8%,transparent 0 68%,rgba(216,108,143,.20) 68.2% 68.6%,transparent 68.8%),radial-gradient(circle at 2% 8%,#f6a9bf 0 5px,transparent 5.5px),radial-gradient(circle at 6% 13%,#ef8eac 0 7px,transparent 7.5px),radial-gradient(circle at 2% 18%,#f5b7c9 0 5px,transparent 5.5px),radial-gradient(circle at 98% 9%,transparent 0 68%,rgba(216,108,143,.20) 68.2% 68.6%,transparent 68.8%),radial-gradient(circle at 98% 9%,#f6a9bf 0 5px,transparent 5.5px),radial-gradient(circle at 94% 14%,#ef8eac 0 7px,transparent 7.5px),radial-gradient(circle at 98% 20%,#f5b7c9 0 5px,transparent 5.5px)}
          .app{z-index:1;max-width:1320px;padding-top:30px}
          #cloudBar,.panel,.buy-shell{background:rgba(255,252,251,.88);border-color:#efd5dd;box-shadow:0 10px 30px rgba(180,93,122,.10)}
          h1{font-family:Georgia,serif;color:#b94f73;font-style:italic;letter-spacing:.2px}
          .subtitle{color:#92717d}
          nav{justify-content:center;background:rgba(255,250,251,.72);border:1px solid #f0d7df;border-radius:999px;padding:5px;box-shadow:0 7px 20px rgba(180,93,122,.07)}
          .tab{border-color:transparent;background:transparent}.tab.active{background:linear-gradient(135deg,#e88ba7,#d96f91);box-shadow:0 5px 12px rgba(217,111,145,.22)}
          .btn{background:#fffafa;border-color:#edd3dc}.btn.primary{background:linear-gradient(135deg,#e88ba7,#d96f91);border-color:#d96f91}
          .stat,.reading-card,.buy-card,.book{background:rgba(255,253,252,.93);border-color:#efd5dd;box-shadow:0 8px 22px rgba(180,93,122,.09)}
          .stat b{color:#a64d6b}.section-title,.book-title,.buy-empty h3{color:#9e4d68}
          .section-sub,.author,.meta,.muted{color:#8a717b}
          input,select,textarea{background:#fffdfc;border-color:#efd5dd}input:focus,select:focus,textarea:focus{border-color:#d96f91;box-shadow:0 0 0 3px #fde1e9}
          .book{border-radius:18px}.cover{background:linear-gradient(145deg,#fde3eb,#f7e9ed)}
          .heart{background:#fff9fb;border-color:#efcbd6;color:#d45f84}
          .chip{background:#fde3eb;color:#9d4c68}
          #currentlySection .panel,#archivedSection .panel{background:rgba(255,252,251,.80);border-color:#ecd8df}
          #dnfSection{background:linear-gradient(135deg,rgba(255,242,246,.96),rgba(255,228,237,.84));border-color:#eab3c3}
          .modal{background:rgba(76,43,56,.25)}.modal-card{background:#fffafc;border-color:#efd5dd}
          @media(max-width:600px){body:after{opacity:.48}.app{padding-top:20px}nav{border-radius:22px}}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply floral theme styles'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-floral-theme.yml
          git commit -m 'Remove temporary floral theme workflow'
          git push
