name: Fix Books to Buy tab navigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-buy-tab.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "['bookshelf','stats','fanfiction'].forEach(x=>$(x+'Panel').style.display=x===t.dataset.tab?'block':'none')"
          new = "['bookshelf','stats','fanfiction','buy'].forEach(x=>$(x+'Panel').style.display=x===t.dataset.tab?'block':'none')"
          if old not in s:
              raise SystemExit('Expected navigation code was not found; refusing to modify index.html')
          s2 = s.replace(old, new, 1)
          if s2.count("['bookshelf','stats','fanfiction','buy']") != 1:
              raise SystemExit('Navigation replacement validation failed')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Books to Buy tab navigation'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-buy-tab.yml
          git commit -m 'Remove temporary navigation fix workflow'
          git push
