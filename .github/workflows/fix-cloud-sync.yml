name: Fix bookshelf cloud sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair bookshelf HTML and spreadsheet importer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The previous patch accidentally inserted a nested <script> tag and
          # an early </script>, causing the remainder of the JavaScript to be
          # rendered as visible page text. Keep the whole app in one script.
          s = s.replace('<script>\nconst bookshelfSupabase', 'const bookshelfSupabase', 1)
          s = s.replace('\n</script>\nconst STORE_KEY', '\nconst STORE_KEY', 1)

          # Keep the XLSX library and file picker enabled.
          library = '<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>\n'
          if library not in s:
              s = s.replace('<script>\nconst SUPABASE_URL=', library + '<script>\nconst SUPABASE_URL=', 1)
          s = re.sub(r'<input id="fileInput" type="file" accept="[^"]*" style="display:none">', '<input id="fileInput" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/json,.json" style="display:none">', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair broken bookshelf script tag'
          git push
