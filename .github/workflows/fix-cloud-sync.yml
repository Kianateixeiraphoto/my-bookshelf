name: Fix bookshelf cloud sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add spreadsheet importer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script>\nconst SUPABASE_URL='
          library = '<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>\n'
          if library not in s:
              s = s.replace(marker, library + marker, 1)
          s = re.sub(r'<input id="fileInput" type="file" accept="[^"]*" style="display:none">', '<input id="fileInput" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/json,.json" style="display:none">', s, count=1)
          if 'src="xlsx-import.js"' not in s:
              s = s.replace('</body>', '<script src="xlsx-import.js"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable XLSX spreadsheet imports'
          git push
