name: Load AO3 screenshot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add screenshot fix script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="ao3-screenshot-fix.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, f'  {tag}\n{marker}', 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit index change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "Load AO3 screenshot OCR repair"
          git push
