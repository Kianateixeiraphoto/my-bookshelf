name: One-time index cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-index-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and validate index
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          original = text

          # Fix the accidentally nested <style> tag without changing the CSS itself.
          text = text.replace('\n<style>\n/* TAG-SECTIONS-V2 */', '\n/* TAG-SECTIONS-V2 */', 1)

          # Remove the retired Books to Buy navigation/panel only.
          text = text.replace('<button class="tab" data-tab="buy">🛍️ Books to Buy</button>', '', 1)
          text = text.replace('<main id="buyPanel" style="display:none"></main>', '', 1)

          # Remove the retired Books to Buy state and renderer, while leaving the
          # shared buy-card/buy-grid styling intact because fanfiction uses it.
          text = text.replace('let state={books:[],buy:[],fanfiction:[]},session=null;', 'let state={books:[],fanfiction:[]},session=null;', 1)
          text = text.replace('renderBuy();', '', 1)
          text = re.sub(r'function renderBuy\(\)\{.*?\nfunction renderFanfiction\(\)', 'function renderFanfiction()', text, count=1, flags=re.S)
          text = text.replace("['bookshelf','stats','fanfiction','buy']", "['bookshelf','stats','fanfiction']", 1)

          # Keep the first, Supabase-native auth implementation and remove the
          # later duplicate definitions that overwrite it.
          marker = "async function restoreSession(){try{let s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');"
          start = text.find(marker)
          if start != -1:
              end = text.find('\nasync function cloudLoad()', start)
              if end == -1:
                  raise SystemExit('Could not locate duplicate restoreSession boundary')
              text = text[:start] + text[end+1:]

          needle = "function openAuth(mode='login')"
          first = text.find(needle)
          second = text.find(needle, first + 1)
          if second != -1:
              end = text.find("\n$('authBtn').onclick=", second)
              if end == -1:
                  raise SystemExit('Could not locate duplicate openAuth boundary')
              text = text[:second] + text[end+1:]

          # Guardrails: this cleanup must never publish a structurally incomplete file.
          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('HTML document boundary validation failed')
          if text.count('<head>') != 1 or text.count('</head>') != 1:
              raise SystemExit('HEAD boundary validation failed')
          if text.count('<body>') != 1 or text.count('</body>') != 1:
              raise SystemExit('BODY boundary validation failed')
          if '<style>\n/* TAG-SECTIONS-V2 */' in text:
              raise SystemExit('Nested style tag was not removed')
          if 'data-tab="buy"' in text or 'id="buyPanel"' in text or 'function renderBuy()' in text:
              raise SystemExit('Books to Buy UI/code was not fully removed')
          if text.count("function restoreSession()") != 1 or text.count("function openAuth(mode='login')") != 1:
              raise SystemExit('Duplicate auth functions remain')
          if 'renderBuy();' in text:
              raise SystemExit('renderBuy call remains')
          if len(text) < 30000:
              raise SystemExit('Unexpectedly small index.html; refusing to publish')

          p.write_text(text, encoding='utf-8')

      - name: Remove retired Books to Buy helper files
        run: |
          rm -f buy-edit-fix.js buy-search.js

      - name: Commit cleanup and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-index-cleanup.yml
          git add index.html buy-edit-fix.js buy-search.js .github/workflows/one-time-index-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Clean up index structure and retired buy code'
          git push