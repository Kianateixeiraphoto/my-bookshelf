name: Repair bookshelf session and library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing app safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          old_restore=r'''async function restoreSession\(\)\{.*?\n\}'''
          new_restore='''async function restoreSession(){try{let s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(!s?.access_token)return;session=s;try{const u=await api('/auth/v1/user');setSession({...s,user:u})}catch(e){if(!s.refresh_token)throw e;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.msg||'Session expired');setSession({access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token,user:d.user})}}catch(e){console.warn('Session restore failed',e);setSession(null)}}'''
          s,n=re.subn(old_restore,new_restore,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('restoreSession block not found')

          old_load=r'''async function cloudLoad\(\)\{.*?\n\}'''
          new_load='''async function cloudLoad(){if(!session)return;try{const uid=session.user.id,newId='library:'+uid;let rows=await api('/rest/v1/books?select=data,updated_at&user_id=eq.'+encodeURIComponent(uid)+'&id=eq.'+encodeURIComponent(newId));if(!rows?.length)rows=await api('/rest/v1/books?select=data,updated_at&user_id=eq.'+encodeURIComponent(uid)+'&id=eq.library');if(rows?.[0]?.data){const cloud=rows[0].data||{};const localBooks=Array.isArray(state.books)?state.books:[],cloudBooks=Array.isArray(cloud.books)?cloud.books:[],key=b=>((b.title||b.name||'')+'|'+(b.author||'')).trim().toLowerCase();const merged=new Map();localBooks.forEach(b=>merged.set(key(b),b));cloudBooks.forEach(b=>{const k=key(b);if(!merged.has(k))merged.set(k,b);else merged.set(k,{...merged.get(k),...b})});state={...state,...cloud,books:Array.from(merged.values())};saveLocal();render();$('cloudStatus').textContent='Synced from cloud 💕';if(localBooks.length>cloudBooks.length)await sync()}else{$('cloudStatus').textContent='Cloud account ready · no saved bookshelf yet'}}catch(e){console.warn(e);$('cloudStatus').textContent='Cloud sync unavailable'}}'''
          s,n=re.subn(old_load,new_load,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('cloudLoad block not found')

          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix session restore and preserve full bookshelf'
          git push
