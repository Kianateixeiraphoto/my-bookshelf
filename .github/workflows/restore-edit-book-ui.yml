name: Restore Edit Book UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-edit-ui:
    if: ${{ !contains(github.event.head_commit.message, '[edit-ui-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore full edit form
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'EDIT-BOOK-FULL-UI' in text:
              print('Full edit UI already present; nothing to do.')
              raise SystemExit(0)

          marker = '</script><script src="xlsx-import.js"></script>'
          if marker not in text:
              raise SystemExit('Could not find script insertion point.')

          override = r'''<script>
          /* EDIT-BOOK-FULL-UI: restored detailed book editor */
          window.addBook = function(book = {}) {
            const tags = Array.isArray(book.tags) ? book.tags : [];
            const tagChoices = [
              'Enemies to Lovers','Friends to Lovers','Friends with Benefits','Fake Dating','Forced Proximity',
              'Only One Bed','Grumpy x Sunshine','Found Family','Second Chance','Forbidden Romance','Age Gap',
              'Dark Romance','Possessive','Jealousy','Betrayal','Hurt/Comfort','Slow Burn','High Angst',
              'Fluff','Spicy','HEA','Shifters','Vampires','Omegaverse','Mpreg','Poly','Sports Romance'
            ];
            const selectedTags = tagChoices.map(t => `<option value="${esc(t)}" ${tags.includes(t) ? 'selected' : ''}>${esc(t)}</option>`).join('');
            const coverPreview = book.cover ? `<img src="${esc(book.cover)}" alt="Current cover" style="width:74px;height:105px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">` : '<div style="width:74px;height:105px;border-radius:8px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:30px">📖</div>';
            const rating = book.rating ? String(book.rating) : '';
            const status = book.status || 'Read';
            const buyPriority = book.buyPriority || book.priority || 'Normal';
            const spice = book.spice || 'Not rated';
            const started = book.dateStarted || book.started || '';
            const finished = book.dateFinished || book.finished || '';

            openModal(`
              <div class="row"><h2>🎀 ${book.id ? 'Edit' : 'Add'} Book</h2><button class="btn" type="button" onclick="closeModal()">Cancel</button></div>
              <form id="bookForm" class="form-grid" style="max-height:78vh;overflow:auto;padding-right:4px">
                <label>Title *<input name="title" value="${esc(book.title || '')}" required></label>
                <label>Author *<input name="author" value="${esc(book.author || '')}" required></label>
                <label>Status<select name="status"><option ${status==='Currently Reading'?'selected':''}>Currently Reading</option><option ${status==='Read'?'selected':''}>Read</option><option ${status==='DNF'?'selected':''}>DNF</option><option ${status==='Want to Read'?'selected':''}>Want to Read</option></select></label>
                <label>Rating<select name="rating"><option value="">Not rated</option><option value="0.5" ${rating==='0.5'?'selected':''}>0.5 stars</option><option value="1" ${rating==='1'?'selected':''}>1 star</option><option value="1.5" ${rating==='1.5'?'selected':''}>1.5 stars</option><option value="2" ${rating==='2'?'selected':''}>2 stars</option><option value="2.5" ${rating==='2.5'?'selected':''}>2.5 stars</option><option value="3" ${rating==='3'?'selected':''}>3 stars</option><option value="3.5" ${rating==='3.5'?'selected':''}>3.5 stars</option><option value="4" ${rating==='4'?'selected':''}>4 stars</option><option value="4.5" ${rating==='4.5'?'selected':''}>4.5 stars</option><option value="5" ${rating==='5'?'selected':''}>5 stars</option></select></label>
                <label>Series<input name="series" value="${esc(book.series || '')}"></label>
                <label>Book #<input name="bookNumber" value="${esc(book.bookNumber || book.seriesNumber || '')}" placeholder="e.g. 2"></label>
                <label>Pages<input name="pages" type="number" min="0" value="${book.pages || ''}"></label>
                <label>Price<input name="price" value="${esc(book.price || '')}" placeholder="e.g. $14.99"></label>
                <label>Buy priority<select name="buyPriority"><option ${buyPriority==='Low'?'selected':''}>Low</option><option ${buyPriority==='Normal'?'selected':''}>Normal</option><option ${buyPriority==='High'?'selected':''}>High</option><option ${buyPriority==='Must Buy'?'selected':''}>Must Buy</option></select></label>
                <label>Spice 🌶️<select name="spice"><option ${spice==='Not rated'?'selected':''}>Not rated</option><option ${spice==='1 chili'?'selected':''}>🌶️ 1 chili</option><option ${spice==='2 chilis'?'selected':''}>🌶️🌶️ 2 chilis</option><option ${spice==='3 chilis'?'selected':''}>🌶️🌶️🌶️ 3 chilis</option><option ${spice==='4 chilis'?'selected':''}>🌶️🌶️🌶️🌶️ 4 chilis</option><option ${spice==='5 chilis'?'selected':''}>🌶️🌶️🌶️🌶️🌶️ 5 chilis</option></select></label>
                <label>Date started<input name="dateStarted" type="date" value="${esc(started)}"></label>
                <label>Date finished<input name="dateFinished" type="date" value="${esc(finished)}"></label>
                <div class="wide">
                  <label>Cover image</label>
                  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px">
                    ${coverPreview}
                    <div><input id="coverFile" type="file" accept="image/*"><div class="status" style="margin-top:5px">Optional. Images are stored in this browser with your book data.</div></div>
                  </div>
                </div>
                <label class="wide">Tags / tropes
                  <select name="tags" id="bookTags" multiple size="7" style="width:100%;margin-top:6px">${selectedTags}</select>
                  <div class="status" style="margin-top:5px">Hold Ctrl/Cmd to select multiple. Selected tags will be saved with the book.</div>
                </label>
                <label class="wide">Notes / review<textarea name="notes" rows="6" placeholder="Your thoughts, review, quotes, reminders…">${esc(book.notes || '')}</textarea></label>
                <div class="wide actions" style="justify-content:flex-end"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save Book</button></div>
              </form>`);

            $('bookForm').onsubmit = async e => {
              e.preventDefault();
              const form = e.target;
              const x = Object.fromEntries(new FormData(form).entries());
              const selected = Array.from($('bookTags').selectedOptions).map(o => o.value);
              const finish = async cover => {
                const obj = {...book, id: book.id || crypto.randomUUID(), title:x.title.trim(), author:x.author.trim(), status:x.status, rating:Number(x.rating||0), series:x.series.trim(), bookNumber:x.bookNumber.trim(), pages:Number(x.pages||0), price:x.price.trim(), buyPriority:x.buyPriority, spice:x.spice, dateStarted:x.dateStarted, dateFinished:x.dateFinished, cover:cover || book.cover || '', tags:selected, notes:x.notes};
                if (book.id) state.books = state.books.map(b => b.id === book.id ? obj : b); else state.books.push(obj);
                saveLocal(); closeModal(); render(); sync();
              };
              const file = $('coverFile')?.files?.[0];
              if (file) {
                const reader = new FileReader();
                reader.onload = () => finish(reader.result);
                reader.readAsDataURL(file);
              } else finish(book.cover || '');
            };
          };
          </script>'''

          text = text.replace(marker, '</script>' + override + '<script src="xlsx-import.js"></script>')
          path.write_text(text, encoding='utf-8')
          print('Restored detailed Edit Book UI.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore full Edit Book UI [edit-ui-bot]"
          git push
