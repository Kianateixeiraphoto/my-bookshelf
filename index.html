<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bookshelf — Phase 2</title>
<style>
:root{
  --bg:#fff7fa;--card:#fffdfd;--ink:#4a3440;--muted:#927682;--line:#f1dbe3;
  --accent:#e99ab5;--accent-dark:#c96f91;--accent2:#fde7ef;--accent3:#f9d2df;
  --gold:#c88b35;--danger:#b85b70;--shadow:0 8px 28px rgba(190,115,145,.10)
}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Inter,ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,#ffeef5 0,transparent 30%),radial-gradient(circle at 95% 10%,#f9e8ff 0,transparent 25%),var(--bg);color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#e9a9bf 1px,transparent 1px);background-size:24px 24px}
.app{max-width:1250px;margin:auto;padding:32px 20px 60px;position:relative}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{font-family:Georgia,serif;font-size:40px;letter-spacing:-.5px;margin:0 0 6px;color:#613f4d}
.subtitle{color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,253,253,.92);border-radius:999px;padding:10px 15px;color:var(--ink);box-shadow:0 3px 10px rgba(190,115,145,.06)}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 6px 16px rgba(201,111,145,.22)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}.stat{background:rgba(255,253,253,.9);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;color:#70495a}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px}
input,select,textarea{border:1px solid var(--line);border-radius:13px;background:#fffafa;padding:10px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.panel{background:rgba(255,253,253,.86);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.book{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);transition:.18s}
.book:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(190,115,145,.16)}.cover{height:255px;background:linear-gradient(145deg,#ffeaf2,#f9e9f2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}.cover-placeholder{font-size:54px;filter:drop-shadow(0 5px 8px #dca1b355)}
.heart{position:absolute;right:10px;top:10px;width:35px;height:35px;border-radius:50%;border:1px solid var(--line);background:#fffafc;color:#c86d8e;display:grid;place-items:center}
.book-body{padding:14px}.book-title{font-family:Georgia,serif;font-size:18px;font-weight:700;color:#684352}.author{font-size:13px;color:var(--muted);margin-top:3px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--accent2);color:#8a5368}.meta{font-size:11px;color:var(--muted);line-height:1.6}.book-actions{display:flex;gap:7px;margin-top:10px}.book-actions .btn{padding:7px 10px;font-size:11px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{border:1px solid var(--line);background:#fffafa;border-radius:999px;padding:9px 15px;color:#6f4d5b}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-title{font-family:Georgia,serif;font-size:23px;color:#684352;margin:5px 0 12px}.section-sub{font-size:12px;color:var(--muted);margin:-7px 0 15px}.section{margin-bottom:22px}
.reading-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.reading-card{background:#fffafa;border:1px solid var(--line);border-radius:17px;padding:14px}.reading-card b{font-size:20px}.reading-card span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.buy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.buy-card{background:#fffafa;border:1px solid var(--line);border-radius:18px;padding:15px}.buy-card h3{font-family:Georgia,serif;margin:0 0 5px}.buy-card .price{font-weight:700;color:#9a5570}.buy-card a{color:#a65777}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(86,45,61,.28);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modal-card{width:min(620px,100%);background:#fffafa;border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:0 24px 80px rgba(90,45,63,.2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.shelf{grid-template-columns:repeat(2,1fr)}.reading-grid{grid-template-columns:repeat(2,1fr)}.buy-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column}h1{font-size:32px}.stats,.shelf,.reading-grid,.buy-grid,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.app{padding:20px 12px 45px}}
</style>
</head>
<body>
<div class="app">
  <div id="cloudBar" class="panel" style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div><b>☁️ Cloud Library</b><div class="muted" style="font-size:11px">Synced just now 💕</div></div>
    <div class="actions"><button class="btn" id="syncBtn">☁️ Sync Now</button><button class="btn" id="signOutBtn">Sign Out</button></div>
  </div>
  <header><div><h1>🎀 My Bookshelf</h1><div class="subtitle">A cozy little home for all your favorite stories. ♡</div></div><div class="actions"><button class="btn" id="importBtn">Import</button><button class="btn" id="exportBtn">Export</button><button class="btn primary" id="addBookBtn">+ Add Book</button></div></header>
  <nav id="nav"><button class="tab active" data-tab="bookshelf">📚 Bookshelf</button><button class="tab" data-tab="stats">📊 Reading Stats</button><button class="tab" data-tab="fanfiction">🖤 Fanfiction</button><button class="tab" data-tab="buy">🛍️ Books to Buy</button></nav>
  <main id="bookshelfPanel">
    <div class="stats"><div class="stat"><b id="totalBooks">0</b><span>Total books</span></div><div class="stat"><b id="readBooks">0</b><span>Read</span></div><div class="stat"><b id="readingBooks">0</b><span>Currently reading</span></div><div class="stat"><b id="avgRating">—</b><span>Avg. rating</span></div><div class="stat"><b id="pagesRead">0</b><span>Pages read</span></div><div class="stat"><b id="favorites">0</b><span>Favorites</span></div></div>
    <div class="toolbar"><input class="search" id="bookSearch" placeholder="Search title, author, series, tags, notes..."><select id="statusFilter"><option value="">All statuses</option><option>Currently Reading</option><option>Read</option><option>DNF</option><option>Want to Read</option></select><select id="ratingFilter"><option value="">Any rating</option><option value="5">5 stars</option><option value="4">4+ stars</option><option value="3">3+ stars</option></select></div>
    <div id="currentlySection" class="section"></div><div id="archivedSection" class="section"></div>
  </main>
  <main id="statsPanel" style="display:none"></main><main id="fanfictionPanel" style="display:none"></main><main id="buyPanel" style="display:none"></main>
</div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<input id="fileInput" type="file" accept="application/json,.json,.csv" style="display:none">
<script>
const SUPABASE_URL='https://ctnsusnfzclqnaloimzu.supabase.co';
const SUPABASE_KEY='sb_publishable_awbAAru2iWbHsjabVF83Gw_FhpiSG0z';
const STORE_KEY='my-bookshelf-data-v6';
let state={books:[],buy:[],fanfiction:[]};
let session=null;
const $=id=>document.getElementById(id);
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');state={...state,...x};}catch(e){}}
function saveLocal(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stars(r){return r? '★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r)):'—'}
function render(){
 const books=state.books||[]; const read=books.filter(b=>b.status==='Read'); const reading=books.filter(b=>b.status==='Currently Reading');
 $('totalBooks').textContent=books.length;$('readBooks').textContent=read.length;$('readingBooks').textContent=reading.length;
 const rated=books.filter(b=>Number(b.rating)>0);$('avgRating').textContent=rated.length?(rated.reduce((a,b)=>a+Number(b.rating),0)/rated.length).toFixed(1):'—';
 $('pagesRead').textContent=read.reduce((a,b)=>a+(Number(b.pages)||0),0).toLocaleString();$('favorites').textContent=books.filter(b=>b.favorite).length;
 const q=($('bookSearch').value||'').toLowerCase();const sf=$('statusFilter').value;const rf=Number($('ratingFilter').value||0);
 let filtered=books.filter(b=>(!q||JSON.stringify(b).toLowerCase().includes(q))&&(!sf||b.status===sf)&&(!rf||Number(b.rating)>=rf));
 const cur=filtered.filter(b=>b.status==='Currently Reading'); const arch=filtered.filter(b=>b.status!=='Currently Reading');
 $('currentlySection').innerHTML=`<div class="section-title">📖 Currently Reading</div><div class="section-sub">Your current reads always stay right up top. 💕</div>${cur.length?`<div class="shelf">${cur.map(bookCard).join('')}</div>`:`<div class="panel empty">Nothing currently reading. Time to pick a new victim. 😂📚</div>`}`;
 $('archivedSection').innerHTML=`<div class="section-title">📚 Archived Books</div><div class="section-sub">Finished, DNF, and other books live here.</div>${arch.length?`<div class="shelf">${arch.map(bookCard).join('')}</div>`:`<div class="panel empty">No archived books yet.</div>`}`;
 renderStats();renderBuy();renderFanfiction();
}
function bookCard(b){return `<article class="book"><div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="">`:'<div class="cover-placeholder">📖</div>'}<button class="heart" onclick="toggleFav('${esc(b.id)}')">${b.favorite?'♥':'♡'}</button></div><div class="book-body"><div class="book-title">${esc(b.title||'Untitled')}</div><div class="author">${esc(b.author||'Unknown author')}</div><div class="chips">${(b.tags||[]).slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="meta">${esc(b.status||'')} · ${b.rating?stars(b.rating):'No rating'}<br>📄 ${Number(b.pages||0).toLocaleString()} pages</div><div class="book-actions"><button class="btn" onclick="editBook('${esc(b.id)}')">Edit</button><button class="btn" onclick="deleteBook('${esc(b.id)}')">Delete</button></div></div></article>`}
function openModal(html){$('modalCard').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function addBook(book={}){openModal(`<div class="row"><h2>🎀 ${book.id?'Edit':'Add'} Book</h2><button class="btn" onclick="closeModal()">Cancel</button></div><form id="bookForm" class="form-grid"><input name="title" placeholder="Book title" value="${esc(book.title||'')}" required><input name="author" placeholder="Author" value="${esc(book.author||'')}"><input name="status" placeholder="Status" value="${esc(book.status||'Read')}"><input name="rating" type="number" min="0" max="5" step="0.5" placeholder="Rating" value="${book.rating||''}"><input name="pages" type="number" placeholder="Pages" value="${book.pages||''}"><input name="cover" placeholder="Cover image URL" value="${esc(book.cover||'')}"><input class="wide" name="tags" placeholder="Tags/tropes, comma separated" value="${esc((book.tags||[]).join(', '))}"><textarea class="wide" name="notes" placeholder="Notes">${esc(book.notes||'')}</textarea><button class="btn primary wide" type="submit">Save Book</button></form>`);$('bookForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const x=Object.fromEntries(f.entries());const obj={...book,...x,id:book.id||crypto.randomUUID(),rating:Number(x.rating||0),pages:Number(x.pages||0),tags:x.tags.split(',').map(s=>s.trim()).filter(Boolean)};if(book.id)state.books=state.books.map(b=>b.id===book.id?obj:b);else state.books.push(obj);saveLocal();closeModal();render();sync()}}
function editBook(id){const b=state.books.find(x=>x.id===id);if(b)addBook(b)}
function deleteBook(id){if(confirm('Delete this book?')){state.books=state.books.filter(b=>b.id!==id);saveLocal();render();sync()}}
function toggleFav(id){state.books=state.books.map(b=>b.id===id?{...b,favorite:!b.favorite}:b);saveLocal();render();sync()}
$('addBookBtn').onclick=()=>addBook();$('bookSearch').oninput=render;$('statusFilter').onchange=render;$('ratingFilter').onchange=render;
function renderStats(){const p=$('statsPanel');const read=state.books.filter(b=>b.status==='Read');const byStatus={};state.books.forEach(b=>byStatus[b.status||'Other']=(byStatus[b.status||'Other']||0)+1);const byGenre={};state.books.flatMap(b=>b.tags||[]).forEach(t=>byGenre[t]=(byGenre[t]||0)+1);p.innerHTML=`<div class="section-title">📊 Reading Stats</div><div class="section-sub">Your reading numbers at a glance. Pie-chart vibes included. 🎀</div><div class="reading-grid"><div class="reading-card"><b>${read.length}</b><span>Books finished</span></div><div class="reading-card"><b>${read.reduce((a,b)=>a+(Number(b.pages)||0),0).toLocaleString()}</b><span>Pages read</span></div><div class="reading-card"><b>${read.length?(read.reduce((a,b)=>a+Number(b.rating||0),0)/read.filter(b=>b.rating).length||0).toFixed(1):'—'}</b><span>Average rating</span></div><div class="reading-card"><b>${state.books.filter(b=>b.favorite).length}</b><span>Favorites</span></div></div><div class="panel" style="margin-top:14px"><h3>Books by status</h3>${pie(byStatus)}</div><div class="panel" style="margin-top:14px"><h3>Tags / tropes</h3>${pie(byGenre)}</div>`}
function pie(obj){const vals=Object.entries(obj);if(!vals.length)return '<div class="empty">Not enough data yet.</div>';const total=vals.reduce((a,[,v])=>a+v,0);let start=0;const colors=['#e99ab5','#c9a0e9','#8fd3c7','#f2bd73','#9bb8e8','#e8a5a5'];const stops=vals.map(([,v],i)=>{const end=start+v/total*360;const s=`${colors[i%colors.length]} ${start}deg ${end}deg`;start=end;return s}).join(',');return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div style="width:190px;height:190px;border-radius:50%;background:conic-gradient(${stops})"></div><div>${vals.map(([k,v],i)=>`<div style="margin:6px 0"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${colors[i%colors.length]};margin-right:6px"></span>${esc(k)}: ${v}</div>`).join('')}</div></div>`}
function renderBuy(){const p=$('buyPanel');p.innerHTML=`<div class="row"><div><div class="section-title">🛍️ Books to Buy</div><div class="section-sub">Add a title and author and we can look up details when the lookup service is available.</div></div><button class="btn primary" onclick="addBuy()">+ Add to Buy List</button></div><div class="buy-grid">${state.buy.length?state.buy.map((b,i)=>`<div class="buy-card"><h3>${esc(b.title)}</h3><div class="muted">${esc(b.author||'')}</div>${b.summary?`<p>${esc(b.summary)}</p>`:''}${b.price?`<div class="price">${esc(b.price)}</div>`:''}${b.link?`<p><a href="${esc(b.link)}" target="_blank" rel="noopener">View book</a></p>`:''}<button class="btn" onclick="removeBuy(${i})">Remove</button></div>`).join(''):'<div class="panel empty" style="grid-column:1/-1">Your buy list is empty. Dangerously responsible of you. 😂</div>'}</div>`}
function addBuy(){openModal(`<h2>🛍️ Add to Buy List</h2><form id="buyForm" class="form-grid"><input name="title" placeholder="Book title" required><input name="author" placeholder="Author" required><input class="wide" name="link" placeholder="Store or book link (optional)"><textarea class="wide" name="summary" placeholder="Summary (optional)"></textarea><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Add to Buy List</button></form>`);$('buyForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());state.buy.push(x);saveLocal();closeModal();render()}}
function removeBuy(i){state.buy.splice(i,1);saveLocal();render()}
function renderFanfiction(){const p=$('fanfictionPanel');const f=state.fanfiction||[];p.innerHTML=`<div class="row"><div><div class="section-title">🖤 Fanfiction</div><div class="section-sub">Keep your AO3 reads separate from your books.</div></div><button class="btn primary" onclick="addFic()">+ Add AO3 Work</button></div><div class="reading-grid"><div class="reading-card"><b>${f.length}</b><span>Works tracked</span></div><div class="reading-card"><b>${f.reduce((a,b)=>a+(Number(b.words)||0),0).toLocaleString()}</b><span>Total words</span></div></div><div style="margin-top:15px" class="buy-grid">${f.length?f.map((x,i)=>`<div class="buy-card"><h3>${esc(x.title||'AO3 Work')}</h3><div class="muted">${esc(x.author||'')}</div><p>📝 ${Number(x.words||0).toLocaleString()} words</p><a href="${esc(x.url||'#')}" target="_blank" rel="noopener">Open on AO3 ↗</a><p><button class="btn" onclick="removeFic(${i})">Remove</button></p></div>`).join(''):'<div class="panel empty" style="grid-column:1/-1">No fanfiction tracked yet.</div>'}</div>`}
function addFic(){openModal(`<h2>🖤 Add AO3 Work</h2><form id="ficForm" class="form-grid"><input class="wide" name="url" placeholder="Paste AO3 link" required><input name="title" placeholder="Title"><input name="author" placeholder="Author"><input name="words" type="number" placeholder="Words"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Add Work</button></form>`);$('ficForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());x.words=Number(x.words||0);state.fanfiction.push(x);saveLocal();closeModal();render()}}
function removeFic(i){state.fanfiction.splice(i,1);saveLocal();render()}
$('nav').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['bookshelf','stats','fanfiction','buy'].forEach(x=>$(x+'Panel').style.display=x===t.dataset.tab?'block':'none');render()};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-bookshelf-backup.json';a.click()};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state={...state,...JSON.parse(r.result)};saveLocal();render();alert('Imported!')}catch{alert('That file could not be imported.')}};r.readAsText(f)};
async function supa(path,opts={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function sync(){if(!session)return;try{await supa('books?user_id=eq.'+encodeURIComponent(session.user.id),{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:'library',user_id:session.user.id,data:state,updated_at:new Date().toISOString()})})}catch(e){console.warn('Sync unavailable',e)}}
$('syncBtn').onclick=()=>sync();$('signOutBtn').onclick=()=>{session=null;location.reload()};
loadLocal();render();
</script>
</body>
</html>
